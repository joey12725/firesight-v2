<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="FIRESight simulates thousands of possible financial lives in your browser to show when work becomes optional, and how sure that is." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>FIRESight</title>
    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        var t = 'system';
        try { t = JSON.parse(localStorage.getItem('firesight.settings') || '{}').state?.theme || 'system'; } catch (e) {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
