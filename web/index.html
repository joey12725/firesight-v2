<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>FIRESight: when can work become optional, and how sure is that?</title>
    <meta name="description" content="FIRESight simulates thousands of possible financial lives in your browser to show when work becomes optional, and how sure that is. No account needed: without one, your plan never leaves your device." />
    <meta name="application-name" content="FIRESight" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FIRESight" />
    <meta property="og:title" content="FIRESight: when can work become optional, and how sure is that?" />
    <meta property="og:description" content="A Monte Carlo early-retirement planner that lives your plan forward tens of thousands of times, in your browser, and shows the whole range rather than one hopeful line." />
    <meta property="og:image" content="%SITE_URL%/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FIRESight: when can work become optional, and how sure is that?" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FIRESight: when can work become optional, and how sure is that?" />
    <meta name="twitter:description" content="Thousands of simulated financial lives, run in your browser. No account needed: without one, your plan never leaves your device." />
    <meta name="twitter:image" content="%SITE_URL%/social-card.png" />
    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        var t = 'system';
        try { t = JSON.parse(localStorage.getItem('firesight.settings') || '{}').state?.theme || 'system'; } catch (e) {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
